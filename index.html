<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  height:100vh;
  width:100vw;
  background: linear-gradient(135deg,#ff4ecd,#ff758c);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.container{
  background:white;
  width:90%;
  max-width:380px;
  padding:25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

h1{
  font-size:1.5rem;
  margin-bottom:8px;
}

h2{
  font-size:1.1rem;
  margin-bottom:20px;
  color:#ff4ecd;
}

.buttons{
  position:relative;
  height:140px;
}

button{
  padding:12px 22px;
  font-size:1rem;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

#yes{
  background:#ff4ecd;
  color:white;
}

#no{
  background:#e0e0e0;
  position:absolute;
  left:120px;
  top:70px;
}

.meme{
  display:none;
}

.meme img{
  width:100%;
  margin-top:15px;
  border-radius:15px;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="name"></h1>
  <h2>Will you be my Valentine? 💍❤️</h2>

  <div class="buttons" id="btnBox">
    <button id="yes" onclick="yesClick()">YES 😍</button>
    <button id="no">NO 🙃</button>
  </div>

  <div class="meme" id="meme">
    <h2>HAHA I KNEW IT 😌💖</h2>
    <img src="https://media.tenor.com/2roX3uxz_68AAAAC/love-happy.gif">
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Hey";

document.getElementById("name").innerText = name + " 💕";

const noBtn = document.getElementById("no");
const box = document.getElementById("btnBox");

// WORKS ON MOBILE + DESKTOP
noBtn.addEventListener("touchstart", moveNo);
noBtn.addEventListener("mouseover", moveNo);

function moveNo(){
  const x = Math.random() * (box.offsetWidth - noBtn.offsetWidth);
  const y = Math.random() * (box.offsetHeight - noBtn.offsetHeight);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

function yesClick(){
  document.getElementById("btnBox").style.display = "none";
  document.querySelector("h2").innerText = "She said YES 😭💘";
  document.getElementById("meme").style.display = "block";
}
</script>

</body>
</html>
