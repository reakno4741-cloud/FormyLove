<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💖 Just One Question…</title>

<style>
:root{
  --pink:#ff4ecd;
  --red:#ff758c;
  --dark:#222;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', system-ui, sans-serif;
}

body{
  height:100vh;
  width:100vw;
  background: radial-gradient(circle at top, #ffb6d5, var(--pink));
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* FLOATING HEARTS BACKGROUND */
.heart{
  position:absolute;
  font-size:1.5rem;
  animation: floatUp linear infinite;
  opacity:.7;
}
@keyframes floatUp{
  from{transform:translateY(100vh) scale(.6); opacity:0;}
  to{transform:translateY(-10vh) scale(1.3); opacity:1;}
}

/* CARD */
.card{
  background:white;
  width:92%;
  max-width:400px;
  border-radius:24px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,.25);
  animation: popIn .8s cubic-bezier(.2,1.3,.4,1);
}
@keyframes popIn{
  from{transform:scale(.6) rotate(-3deg); opacity:0;}
  to{transform:scale(1) rotate(0); opacity:1;}
}

h1{
  font-size:1.6rem;
  margin-bottom:6px;
}
h2{
  font-size:1.15rem;
  color:var(--pink);
  margin-bottom:20px;
}

/* BUTTONS */
.btn-area{
  position:relative;
  height:150px;
}

button{
  border:none;
  padding:14px 26px;
  border-radius:999px;
  font-size:1rem;
  cursor:pointer;
  transition:.2s;
}

#yes{
  background:linear-gradient(135deg,var(--pink),var(--red));
  color:white;
  box-shadow:0 10px 20px rgba(255,78,205,.4);
}

#no{
  position:absolute;
  background:#eee;
  color:#444;
  left:120px;
  top:80px;
}

/* SUCCESS SCREEN */
.success{
  display:none;
  animation: fadeUp .6s ease forwards;
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.big-heart{
  font-size:3rem;
  animation: beat .8s infinite alternate;
}
@keyframes beat{
  from{transform:scale(1);}
  to{transform:scale(1.25);}
}

.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.confetti span{
  position:absolute;
  width:8px;
  height:14px;
  background:var(--pink);
  animation: fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-10vh) rotate(0);}
  to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<!-- Floating hearts -->
<script>
for(let i=0;i<25;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=3+Math.random()*5+"s";
  h.style.fontSize=1+Math.random()*2+"rem";
  document.body.appendChild(h);
}
</script>

<div class="card">
  <h1 id="name">Hey 💕</h1>
  <h2 id="question">I have one question for you…</h2>

  <div class="btn-area" id="btnArea">
    <button id="yes">YES 😍</button>
    <button id="no">NO 🙃</button>
  </div>

  <div class="success" id="success">
    <div class="big-heart">💖</div>
    <h2 style="margin-top:10px;">Best decision ever 😭❤️</h2>
    <p>You just made my whole day.</p>
  </div>
</div>

<!-- CONFETTI -->
<div class="confetti" id="confetti"></div>

<script>
/* NAME FROM URL */
const params=new URLSearchParams(location.search);
const person=params.get("name")||"Hey";
document.getElementById("name").innerText=person+" 💕";

/* NO BUTTON ESCAPE */
const no=document.getElementById("no");
const area=document.getElementById("btnArea");

function escape(){
  const x=Math.random()*(area.offsetWidth-no.offsetWidth);
  const y=Math.random()*(area.offsetHeight-no.offsetHeight);
  no.style.left=x+"px";
  no.style.top=y+"px";
}
no.addEventListener("mouseover",escape);
no.addEventListener("touchstart",escape);

/* YES CLICK */
document.getElementById("yes").onclick=()=>{
  area.style.display="none";
  document.getElementById("question").innerText="Will you be mine forever? 💍";
  document.getElementById("success").style.display="block";
  launchConfetti();
};

/* CONFETTI LOGIC */
function launchConfetti(){
  const box=document.getElementById("confetti");
  for(let i=0;i<60;i++){
    const c=document.createElement("span");
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=2+Math.random()*3+"s";
    c.style.background=`hsl(${Math.random()*360},80%,70%)`;
    box.appendChild(c);
  }
}
</script>

</body>
</html>
